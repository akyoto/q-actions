name: test

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-26-intel, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6 # pin@v4
        with:
          repository: akyoto/q
      - name: Setup Go environment
        uses: actions/setup-go@v6 # pin@v5
        with:
          go-version: '1.26'
          check-latest: true
      - name: Run tests
        run: |
          go version
          go test ./...
        shell: bash